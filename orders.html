<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
My Orders - Saudagar Farms
</title>

<style>

.footer{
padding: 20px;
text-align: center;
word-wrap: break-word;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f4f8f1;
padding:30px;
overflow-x: hidden;
}

h1{
text-align:center;
margin-bottom:40px;
color:#234b2c;
}

.orders-container{
max-width:1100px;
margin:auto;
}

.order-card{

background:white;

padding:25px;

border-radius:20px;

margin-bottom:25px;

box-shadow:
0 5px 15px rgba(0,0,0,0.08);
}

.top{

display:flex;

justify-content:space-between;

flex-wrap:wrap;

gap:15px;

margin-bottom:20px;
}

.status{

padding:10px 18px;

border-radius:20px;

color:white;

font-weight:bold;
}

.products{
margin-top:20px;
}

.product{

display:flex;

align-items:center;

gap:15px;

margin-bottom:15px;

padding:15px;

background:#f8fbf4;

border-radius:15px;
}

.product img{

width:80px;
height:80px;

object-fit:cover;

border-radius:12px;
}

.empty{
text-align:center;
font-size:25px;
color:#666;
margin-top:80px;
}

@media(max-width:700px){

.product{
flex-direction:column;
text-align:center;
}

}

</style>

</head>

<body>

<h1>
📦 My Orders
</h1>

<div
class="orders-container"
id="ordersContainer">

</div>

<script type="module">

import { db }
from './js/firebase.js';

import {

collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* LOGIN CHECK */

const userEmail =
localStorage.getItem(
"userEmail"
);

if(!userEmail){

alert("Please Login First");

window.location.href =
"login.html";

}


/* CONTAINER */

const ordersContainer =
document.getElementById(
"ordersContainer"
);


/* LOAD ORDERS */

async function loadOrders(){

const querySnapshot =
await getDocs(
collection(db,"orders")
);

ordersContainer.innerHTML = "";

let found = false;


/* LOOP */

querySnapshot.forEach((doc)=>{

const order = doc.data();

if(order.user !== userEmail){
return;
}

found = true;

let productsHTML = "";


/* PRODUCTS */

(order.products || [])
.forEach((item)=>{

productsHTML += `

<div class="product">

<img src="${item.image}">

<div>

<h3>${item.name}</h3>

<p>
Quantity:
${item.quantity}
</p>

<p>
₹${item.price}
</p>

</div>

</div>

`;

});


/* STATUS COLOR */

let color = "#fb8500";

if(order.status === "Delivered"){
color = "#2a9d8f";
}

if(order.status === "Packed"){
color = "#ffb703";
}

if(order.status === "Out for Delivery"){
color = "#3a86ff";
}


/* CARD */

ordersContainer.innerHTML += `

<div class="order-card">

<div class="top">

<div>

<h2>
Order ID:
${doc.id}
</h2>

<p>
Payment:
${order.paymentMethod}
</p>

<p>
Total:
₹${order.total}
</p>

</div>

<div
class="status"
style="background:${color}">

${order.status}

</div>

</div>

<div class="products">

${productsHTML}

</div>

</div>

`;

});


/* EMPTY */

if(!found){

ordersContainer.innerHTML = `

<div class="empty">

No Orders Found 🌱

</div>

`;

}

}


/* INITIAL */

loadOrders();

</script>

</body>

</html>
