<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Saudagar Farms Signup
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow-x: hidden;
height:100vh;

display:flex;
flex-wrap: wrap;

justify-content:center;

align-items:center;

background:

linear-gradient(
rgba(0,0,0,0.5),
rgba(0,0,0,0.5)
),

url('https://images.unsplash.com/photo-1500382017468-9049fed747ef');

background-size:cover;
background-position:center;
}

.box{

width:400px;

background:white;

padding:40px;

border-radius:20px;

box-shadow:
0 5px 15px rgba(0,0,0,0.3);
}

h1{

text-align:center;

margin-bottom:30px;

color:#234b2c;
}

input{

width:100%;

padding:15px;

margin-bottom:20px;

border:none;

border-radius:10px;

background:#f1f1f1;
}

button{

width:100%;

padding:15px;

border:none;

border-radius:10px;

background:#4CAF50;

color:white;

font-size:18px;

cursor:pointer;
}

button:hover{
background:#2e8b57;
}

p{

text-align:center;

margin-top:20px;
}

a{
color:#4CAF50;
text-decoration:none;
font-weight:bold;
}
.footer{
padding: 20px;
text-align: center;
word-wrap: break-word;
}
</style>

</head>

<body>

<div class="box">

<h1>
🌿 Signup
</h1>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="signup()">
Create Account
</button>

<p>
Already have account?

<a href="login.html">
Login
</a>

</p>

</div>

<script type="module">

import { auth }
from './js/firebase.js';

import {

createUserWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


window.signup =
async function(){

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;


try{

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert(
"✅ Signup Successful"
);

window.location.href =
"login.html";

}

catch(error){

alert(error.message);

}

}

</script>

</body>
</html>
