<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goats - Saudagar Farms</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e8f5e9, #f1f8e9);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #2e7d32;
    }

    .container {
      text-align: center;
      padding: 30px;
      border-radius: 15px;
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 500px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
      color: #555;
    }

    .badge {
      display: inline-block;
      padding: 10px 20px;
      background: #43a047;
      color: white;
      border-radius: 50px;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .back {
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐐 Goats Section</h1>
    <p>This section is currently under development.</p>
    <div class="badge">Coming Soon</div>
    <br />
    <a class="back" href="index.html">← Back to Home</a>
  </div>
</body>
</html>
