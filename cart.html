<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Saudagar Farms - Cart
</title>

<style>

.footer{
padding: 20px;
text-align: center;
word-wrap: break-word;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f4f8f1;
overflow-x: hidden;
padding:30px;
}

h1{
text-align:center;
margin-bottom:30px;
color:#234b2c;
}

/* CONTAINER */

.cart-container{
max-width:1200px;
margin:auto;
}

/* CART ITEM */

.cart-item{

background:white;

padding:20px;

border-radius:20px;

margin-bottom:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 5px 15px rgba(0,0,0,0.08);
}

/* LEFT */

.left{
display:flex;
align-items:center;
gap:20px;
}

.left img{

width:120px;
height:120px;

object-fit:cover;
border-radius:15px;
max-width: 100%;
}

/* INFO */

.info h2{
color:#234b2c;
margin-bottom:10px;
}

.price{
color:#4CAF50;
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

/* ACTIONS */

.actions{
display:flex;
gap:10px;
align-items:center;
}

.qty-btn{

width:35px;
height:35px;

border:none;

border-radius:50%;

background:#4CAF50;

color:white;

cursor:pointer;

font-size:18px;
}

.remove-btn{

padding:10px 15px;

border:none;

background:#d62828;

color:white;

border-radius:10px;

cursor:pointer;
}

/* TOTAL BOX */

.total-box{

background:white;

padding:30px;

border-radius:20px;

margin-top:30px;

text-align:center;

box-shadow:
0 5px 15px rgba(0,0,0,0.08);
}

.total-box h2{
margin-bottom:20px;
color:#234b2c;
}

/* BUTTONS */

.checkout-btn{

padding:15px 30px;

border:none;

background:#4CAF50;

color:white;

border-radius:10px;

font-size:18px;

cursor:pointer;

margin-top:20px;
}

.clear-btn{

padding:15px 30px;

border:none;

background:#d62828;

color:white;

border-radius:10px;

font-size:18px;

cursor:pointer;

margin-top:15px;
}

/* EMPTY */

.empty{
text-align:center;
font-size:25px;
color:#666;
margin-top:80px;
}

/* MOBILE */

@media(max-width:800px){

.actions{
flex-wrap:wrap;
justify-content:center;
}

.qty-btn,
.remove-btn{
width: 100%;;
}


.cart-item{
flex-direction:column;
gap:20px;
}

.left{
flex-direction:column;
text-align:center;
}

}

</style>

</head>

<body>

<h1>
🛒 Your Cart
</h1>

<div
class="cart-container"
id="cartContainer">

</div>

<script type="module">

/* ========================= */
/* LOGIN CHECK */
/* ========================= */

const userEmail =
localStorage.getItem(
"userEmail"
);

if(!userEmail){

alert(
"Please Login First"
);

window.location.href =
"login.html";

}


/* ========================= */
/* IMPORTS */
/* ========================= */

import { db }
from './js/firebase.js';


/* ========================= */
/* CART DATA */
/* ========================= */

const cartContainer =
document.getElementById(
"cartContainer"
);


let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];


/* ========================= */
/* RENDER CART */
/* ========================= */

function renderCart(){

cartContainer.innerHTML = "";


/* EMPTY CART */

if(cart.length === 0){

cartContainer.innerHTML = `

<div class="empty">

🛒 Cart Is Empty 🌱

</div>

`;

return;

}


let total = 0;


/* LOOP ITEMS */

cart.forEach((item,index)=>{

const qty =
item.quantity || 1;

const itemTotal =
item.price * qty;

total += itemTotal;


cartContainer.innerHTML += `

<div class="cart-item">

<div class="left">

<img src="${item.image}">

<div class="info">

<h2>
${item.name}
</h2>

<div class="price">

₹${item.price}

${item.category === "Mangoes"
? "/kg"
: ""}

</div>

<p>
Quantity:
${qty}
</p>

<p>
Total:
₹${itemTotal}
</p>

</div>

</div>


<div class="actions">

<button
class="qty-btn"
onclick="changeQty(${index},-1)">

-

</button>

<button
class="qty-btn"
onclick="changeQty(${index},1)">

+

</button>

<button
class="remove-btn"
onclick="removeItem(${index})">

Remove

</button>

</div>

</div>

`;

});


/* SHIPPING */



const grandTotal =
total ;


/* SAVE TOTAL */

localStorage.setItem(
"totalAmount",
grandTotal
);


/* BILL */

cartContainer.innerHTML += `

<div class="total-box">

<h2>
Subtotal:
₹${total}
</h2>



<h2>
Grand Total:
₹${grandTotal}
</h2>

<p style="
margin-top:15px;
color:#666;
font-size:15px;
line-height:1.6;
">

🚚 Delivery Charges:

✅ FREE delivery on 25KG+ orders within 5KM radius

📍 Beyond 5KM:
₹12 per KM charges apply

</p>

<button
class="checkout-btn"
onclick="goCheckout()">

Place Order ✅

</button>

<br>

<button
class="clear-btn"
onclick="clearCart()">

Clear Cart

</button>

</div>

`;

}


/* ========================= */
/* GO CHECKOUT */
/* ========================= */

window.goCheckout =
function(){

window.location.href =
"checkout.html";

}


/* ========================= */
/* CHANGE QTY */
/* ========================= */

window.changeQty =
function(index,change){

cart[index].quantity =
(cart[index].quantity || 1)
+ change;


/* MIN LIMIT */

if(cart[index].quantity < 1){

cart[index].quantity = 1;

}


/* MAX LIMIT */

if(cart[index].quantity > 100){

alert(
"Maximum Quantity Reached"
);

cart[index].quantity = 100;

}


localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}


/* ========================= */
/* REMOVE ITEM */
/* ========================= */

window.removeItem =
function(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}


/* ========================= */
/* CLEAR CART */
/* ========================= */

window.clearCart =
function(){

localStorage.removeItem(
"cart"
);

cart = [];

renderCart();

}


/* INITIAL LOAD */

renderCart();

</script>

</body>
</html>
